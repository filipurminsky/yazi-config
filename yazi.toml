# ~/.config/yazi/yazi.toml
[mgr]
linemode = "size_and_mtime"
# For example, to change the visible status of hidden files - true
show_hidden = false

[plugin]
  # git.yazi: fetch git status for files and directories
  prepend_fetchers = [
    { url = "*",  run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
  ]
  prepend_preloaders = [
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
    # Office documents (office.yazi)
    { mime = "application/openxmlformats-officedocument.*", run = "office" },
    { mime = "application/oasis.opendocument.*", run = "office" },
    { mime = "application/ms-*", run = "office" },
    { mime = "application/msword", run = "office" },
    { url = "*.docx", run = "office" },
  ]
  prepend_previewers = [
	# Piper is Yazi's maintained command-preview plugin. Render Markdown with
	# Glow before the generic text previewer; $w and $t match Yazi's pane width
	# and terminal light/dark mode.
	{ url = "*.{md,mdx,markdown,mdown,mkd,mkdn}", run = 'piper -- CLICOLOR_FORCE=1 glow --width "$w" --style "$t" "$1"' },
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
    # Office documents (office.yazi)
    { mime = "application/openxmlformats-officedocument.*", run = "office" },
    { mime = "application/oasis.opendocument.*", run = "office" },
    { mime = "application/ms-*", run = "office" },
    { mime = "application/msword", run = "office" },
    { url = "*.docx", run = "office" },
  ]
  # There are more extensions which are supported by mediainfo.
  # Just add file's MIME type to `previewers`, `preloaders` above.
  # https://mediaarea.net/en/MediaInfo/Support/Formats

# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks
[tasks]
  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB


[spot]
# Section header style.
# Example: Video, Text, Image,... with green color in preview images above
title = { fg = "green" }

# Value style.
# Example: `Format: FLAC` with blue color in preview images above
tbl_col = { fg = "blue" }

# Or, use rules to rewrite the entire default rules:
[opener]
edit = [
  { run = 'nvim %s', block = true },
]

play = [
  { run = 'open -a VLC %s', orphan = true, for = "macos" },
]

# zathura-open detaches and focuses the window; orphan keeps it alive when yazi
# exits. See ~/.local/bin/zathura-open for why it isn't plain `open -a`.
document = [
  { run = 'zathura-open %s', orphan = true, for = "macos" },
]

image = [
  { run = 'open -a Preview %s', orphan = true, for = "macos" },
]

# Hand off to the system default app. Replaces the `open` opener that the
# default config provides, which defining [opener] here overrides away.
open = [
  { run = 'open %s', desc = "Open", orphan = true, for = "macos" },
]

[open]
rules = [
	# Multiple openers for a single rule. Must stay above the text/* rule
	# below, which would otherwise swallow text/html.
	{ url = "*.html", use = [ "open", "edit" ] },

	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "play" },

	# zathura handles PDF, PostScript, DjVu and comic-book archives
	{ mime = "application/pdf", use = "document" },
	{ mime = "application/postscript", use = "document" },
	{ mime = "image/vnd.djvu", use = "document" },
	{ url = "*.{djvu,djv,cbr,cbz,cbt,cba,cb7}", use = "document" },

	# Must stay below the djvu rules above, which are also image/* mimes
	{ mime = "image/*", use = "image" },

	# { mime = "application/json", use = "edit" },
	{ url = "*.json", use = "edit" },

	# Fallback, mirroring the default config. Without it anything unmatched
	# above has no opener at all.
	{ url = "*", use = "open" },
]
